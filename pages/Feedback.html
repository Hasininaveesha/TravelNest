<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Support </title>
    <link rel="stylesheet" href="../css/Feedback.css">
</head>
<body>

<header>
  <div class="logo">TravelNest</div>

  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="explorer.html">Explorer</a>
    <a href="Budget.html">Budget Planner</a>
    <a href="Random.html">Trip Generator</a>
    <a href="mood.html">Travel Mood</a>
    <a href="Feedback.html">Feedback</a>

  </nav> 
</header>

    <h1>Feedback & Support</h1>

    <div class="container">

    <h2>Send Feedback</h2>

    <form id="feedbackForm">

        <label>Name</label>
        <input type="text" id="name">

        <label>Email</label>
        <input type="email" id="email">

        <label>Message</label>
        <textarea id="message"></textarea>

        <button type="submit">
        Submit Feedback
        </button>

    </form>

    <p id="successMessage"></p>

    <h2>FAQ</h2>

    <div class="faq">

        <button class="accordion">
        How do I save destinations?
        </button>

        <div class="panel">
        <p>
            You can save destinations using the wishlist button.
        </p>
        </div>

        <button class="accordion">
        Can I use the website on mobile?
        </button>

        <div class="panel">
        <p>
            Yes, the website is fully responsive.
        </p>
        </div>

        <button class="accordion">
        Is my data stored?
        </button>

        <div class="panel">
        <p>
            Yes, data is stored using localStorage.
        </p>
        </div>

    </div>

    </div>

    <script src="../js/Feedback.js"></script>   
</body>
</html>
